<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Meridian · Business Volume Blade (standalone HTML/CSS/JS)</title>
<meta name="description" content="Standalone, framework-free version of the Meridian handset Business-class liquid volume blade." />
<style>
  /* ---- Change one token, everything re-colours ---- */
  :root { --hue: 300; --level: 6; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050507; font-family: Inter, system-ui, sans-serif; color: #fff; }
  .wrap { display: flex; gap: 40px; align-items: center; }
  .blade { position: relative; width: 44px; height: 196px; border-radius: 26px; padding: 1.5px; overflow: hidden; cursor: pointer; user-select: none; }
  .blade::before { /* animated gradient rim */
    content: ""; position: absolute; inset: -60%;
    background: conic-gradient(hsl(var(--hue) 85% 65%), hsl(calc(var(--hue) + 60) 85% 65%), hsl(calc(var(--hue) + 150) 85% 65%), hsl(var(--hue) 85% 65%));
    animation: spin 8s linear infinite; opacity: .75; }
  .glass { position: relative; height: 100%; border-radius: 26px; background: rgba(0,0,0,.55); overflow: hidden;
    box-shadow: inset 0 1px 1px rgba(255,255,255,.5), inset 0 0 0 1px rgba(255,255,255,.18); }
  .fill { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--level) * 10%);
    background: linear-gradient(to top, hsl(var(--hue) 85% 55%), hsl(calc(var(--hue) + 60) 85% 62%), hsl(calc(var(--hue) + 150) 85% 70% / .6));
    transition: height .9s cubic-bezier(.34, 1.56, .64, 1); /* springy overshoot */ }
  .surface { position: absolute; top: -9px; left: 0; width: 100%; height: 12px; }
  .surface.slosh-up { animation: sloshUp 1.1s ease-out; }
  .surface.slosh-down { animation: sloshDown 1.1s ease-out; }
  .wave { position: absolute; inset: 0; width: 200%; height: 100%; }
  .wave.a { animation: drift 2.4s linear infinite; }
  .wave.b { animation: drift 3.6s linear infinite reverse; }
  .bubble { position: absolute; bottom: 0; border-radius: 50%; background: rgba(255,255,255,.6); animation: rise 3s ease-out infinite; }
  .label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 10px 0; font-weight: 700; pointer-events: none; }
  .label b { font-size: 16px; }
  .shine { position: absolute; left: 18%; right: 18%; top: 5%; height: 30%; border-radius: 99px; background: linear-gradient(rgba(255,255,255,.3), transparent); pointer-events: none; }
  .ctrl { font-size: 13px; color: rgba(255,255,255,.6); line-height: 1.8; }
  input[type=range] { width: 200px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @keyframes sloshUp { 0% { transform: skewY(-14deg) translateY(-4px); } 35% { transform: skewY(9deg) translateY(2px); } 70% { transform: skewY(-4deg); } 100% { transform: none; } }
  @keyframes sloshDown { 0% { transform: skewY(14deg) translateY(4px); } 35% { transform: skewY(-9deg) translateY(-2px); } 70% { transform: skewY(4deg); } 100% { transform: none; } }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: .8; } 100% { transform: translateY(-120px) translateX(3px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <h1 hidden>Meridian volume blade</h1>
  <div class="blade" id="blade" role="slider" aria-label="Volume" aria-valuemin="0" aria-valuemax="10" aria-valuenow="6" tabindex="0">
    <div class="glass">
      <div class="fill" id="fill">
        <div class="surface" id="surface">
          <svg class="wave a" viewBox="0 0 44 10" preserveAspectRatio="none"><path d="M0 5 Q5.5 0 11 5 T22 5 T33 5 T44 5 V10 H0Z" fill="hsl(calc(var(--hue) + 150) 85% 70% / .65)"/></svg>
          <svg class="wave b" viewBox="0 0 44 10" preserveAspectRatio="none"><path d="M0 6 Q5.5 2 11 6 T22 6 T33 6 T44 6 V10 H0Z" fill="hsl(calc(var(--hue) + 60) 85% 65% / .55)"/></svg>
        </div>
        <span class="bubble" style="left:15%;width:2px;height:2px;animation-delay:0s"></span>
        <span class="bubble" style="left:44%;width:3px;height:3px;animation-delay:.6s;animation-duration:3.5s"></span>
        <span class="bubble" style="left:73%;width:4px;height:4px;animation-delay:1.2s;animation-duration:4.5s"></span>
        <span class="bubble" style="left:32%;width:2px;height:2px;animation-delay:1.8s"></span>
        <span class="bubble" style="left:61%;width:3px;height:3px;animation-delay:2.4s;animation-duration:3.5s"></span>
        <span class="bubble" style="left:20%;width:4px;height:4px;animation-delay:3s;animation-duration:4.5s"></span>
      </div>
      <span class="shine"></span>
      <div class="label"><span>+</span><b id="num">6</b><span>−</span></div>
    </div>
  </div>
  <div class="ctrl">
    Click top/bottom half or use ↑ ↓<br />
    Brand hue <input type="range" id="hue" min="0" max="359" value="300" /><br />
    <small>Only dependency: none. ~3 KB. Works in any WebKit/Chromium kiosk.</small>
  </div>
</main>
<script>
  const root = document.documentElement, blade = document.getElementById('blade'), surface = document.getElementById('surface'), num = document.getElementById('num');
  let level = 6;
  function setLevel(next) {
    next = Math.max(0, Math.min(10, next)); if (next === level) return;
    surface.classList.remove('slosh-up', 'slosh-down'); void surface.offsetWidth; // restart animation
    surface.classList.add(next > level ? 'slosh-up' : 'slosh-down');
    level = next; root.style.setProperty('--level', level); num.textContent = level; blade.setAttribute('aria-valuenow', level);
    // ↓ Go live: forward to the seatback, e.g. adapters.setVolume(level)
  }
  blade.addEventListener('pointerup', (e) => { const r = blade.getBoundingClientRect(); setLevel(level + (e.clientY - r.top < r.height / 2 ? 1 : -1)); });
  window.addEventListener('keydown', (e) => { if (e.key === 'ArrowUp') setLevel(level + 1); if (e.key === 'ArrowDown') setLevel(level - 1); });
  document.getElementById('hue').addEventListener('input', (e) => root.style.setProperty('--hue', e.target.value));
</script>
</body>
</html>
